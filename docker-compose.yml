version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: safety_firewall_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: safety_firewall
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: safety_firewall_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: safety_firewall_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespassword@postgres:5432/safety_firewall
      - REDIS_URL=redis://redis:6379/0
      - ENV=development
      - RATE_LIMIT_ENABLED=true
      - RATE_LIMIT_REQUESTS=60
      - RATE_LIMIT_WINDOW_SECONDS=60
      - AUTH_ENABLED=true
      - INITIAL_ADMIN_USERNAME=admin
      - INITIAL_ADMIN_PASSWORD=change-me-in-production
      - JWT_SECRET_KEY=super-secret-jwt-key-replace-in-production
      - JWT_EXPIRE_MINUTES=30
      - AUTH_LOGIN_RATE_LIMIT_REQUESTS=10
      - AUTH_LOGIN_RATE_LIMIT_WINDOW_SECONDS=60
      - CORS_ALLOWED_ORIGINS=http://localhost:5173
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: safety_firewall_frontend
    restart: always
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

  traffic-generator:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: safety_firewall_traffic_generator
    restart: always
    environment:
      - BACKEND_URL=http://backend:8000
    command: ["python", "scripts/seed_data.py"]
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:

